<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 명언</title>
    <style>
        body {
            background-color: #EBDFD0;
            font-family: "Noto Sans KR", sans-serif;
        }

        .main {
            width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: rgb(255, 255, 241);
            border-radius: 50px;
            box-shadow: 0 0 10px black;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-sizing: border-box;
        }

        .box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: white;
            border: black solid 2px;
            min-height: 100px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            width: 150px;
            height: 40px;
            background-color: #D7C5AE;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #C5A588;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>오늘의 명언</h1>
        <p>오늘 하루를 시작하는 당신, 명언 하나쯤 마음에 간직해두는게 어떨까요?</p>
        <div class="box">
            <h2 id="text">명언이 여기에 표시됩니다</h2>
        </div>
        <button id="btn">명언 뽑기</button>
    </div>

</html>
